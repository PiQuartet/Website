<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- comment -%}
  This layout is intentionally minimal to avoid conflicts with your existing CSS/JS.
  If your site has a global stylesheet (e.g., /styles.css or /assets/site.css),
  link it here:
  {%- endcomment -%}
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
    {{ content }}
  </main>
</body>
</html>
