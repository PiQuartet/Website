backend:
  name: github
  repo: PiQuartet/Website
  branch: main
  # Optional (recommended if you don't want to grant write access directly):
  # base_url: https://your-oauth.example.com
  # auth_endpoint: /oauth/authorize

media_folder: "assets/uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Events"
    folder: "_events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date & Time", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Price", name: "price", widget: "string", required: false }
      - { label: "Hero Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      # You can add specific HTML pages to edit as Markdown here if you convert them.
      # For now we keep your HTML intact without CMS editing.
      - label: "Events Index"
        name: "events_index"
        file: "events.html"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown", required: false }